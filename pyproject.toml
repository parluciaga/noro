[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noro"
version = "0.1.0"
description = "Positional-snoring watchdog: detects supine sleep posture with a NoIR camera and pulses an actuator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
train = ["tensorflow>=2.16", "opencv-python>=4.8"]

[project.scripts]
noro = "noro.main:main"

[tool.setuptools.packages.find]
include = ["noro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
